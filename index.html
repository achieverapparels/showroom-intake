<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Achiever Apparels — Showroom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #1A3049;
    --navy-deep: #232A2F;
    --terracotta: #C5674A;
    --cream: #F9F8F7;
    --grey: #6F7378;
    --grey-light: #ADB8BB;
    --border: #E3E0D9;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--cream);
  }
  body {
    font-family: 'Manrope', sans-serif;
    color: var(--navy);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 40px 22px 32px;
  }
  .logo {
    width: 220px;
    max-width: 60vw;
    height: auto;
    margin-bottom: 28px;
  }
  .eyebrow {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: var(--grey);
    margin-bottom: 10px;
  }
  .headline {
    font-family: 'Fraunces', serif;
    font-size: 26px;
    font-weight: 500;
    color: var(--navy);
    text-align: center;
    margin: 0 0 30px;
    line-height: 1.3;
  }
  .headline em {
    font-style: italic;
    color: var(--terracotta);
    font-weight: 500;
  }
  .style-card {
    width: 100%;
    max-width: 400px;
    background: #ffffff;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 20px;
    text-align: center;
    margin-bottom: 30px;
  }
  .style-card .label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1.8px;
    text-transform: uppercase;
    color: var(--grey-light);
    margin-bottom: 4px;
  }
  .style-card .value {
    font-family: 'Fraunces', serif;
    font-size: 22px;
    font-weight: 500;
    color: var(--navy);
  }
  .style-card.missing .value {
    font-family: 'Manrope', sans-serif;
    color: var(--terracotta);
    font-size: 14px;
    font-weight: 600;
  }
  .buttons {
    width: 100%;
    max-width: 400px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  button.action {
    appearance: none;
    border: 1px solid var(--border);
    background: #ffffff;
    border-radius: 10px;
    padding: 20px 22px;
    text-align: left;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    display: flex;
    align-items: center;
    justify-content: space-between;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  button.action:active {
    background: #F4F1EC;
  }
  button.action .text {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  button.action .title {
    font-family: 'Fraunces', serif;
    font-size: 18px;
    font-weight: 500;
    color: var(--navy);
  }
  button.action .subtitle {
    font-size: 12px;
    color: var(--grey);
    font-weight: 500;
  }
  button.action .arrow {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 20px;
    color: var(--terracotta);
    margin-left: 12px;
    flex-shrink: 0;
  }
  #feedback-btn:hover, #feedback-btn:active { border-color: var(--terracotta); }
  #checkin-btn:hover, #checkin-btn:active { border-color: var(--navy); }
  #checkout-btn:hover, #checkout-btn:active { border-color: var(--navy); }

  .footer {
    margin-top: 34px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1.8px;
    text-transform: uppercase;
    color: var(--grey-light);
    text-align: center;
  }
</style>
</head>

<script>
  // ---- Configuration ----
  var FEEDBACK_FORM_URL = "https://airtable.com/appCR0Vda4YMKS5X4/pagEUurmA2y1fFINM/form";
  var CHECKINOUT_FORM_URL = "https://airtable.com/appCR0Vda4YMKS5X4/paguceH2lspghGYbJ/form";
  var STYLE_ID_FIELD = "Style ID";
  var ACTION_FIELD = "Action";
  // ------------------------

  function getStyleId() {
    var params = new URLSearchParams(window.location.search);
    return params.get("styleID") || params.get("styleId") || params.get("StyleID") || "";
  }

  function buildFeedbackUrl(styleId) {
    var params = new URLSearchParams();
    if (styleId) params.set("prefill_" + STYLE_ID_FIELD, styleId);
    return FEEDBACK_FORM_URL + "?" + params.toString();
  }
  function buildCheckUrl(action, styleId) {
    var params = new URLSearchParams();
    if (styleId) params.set("prefill_" + STYLE_ID_FIELD, styleId);
    params.set("prefill_" + ACTION_FIELD, action);
    return CHECKINOUT_FORM_URL + "?" + params.toString();
  }

  var styleId = getStyleId();
  var styleCard = document.getElementById("style-card");
  var styleValue = document.getElementById("style-value");

  if (styleId) {
    styleValue.textContent = styleId;
  } else {
    styleCard.classList.add("missing");
    styleValue.textContent = "Not detected — you can add it manually on the next screen";
  }

  document.getElementById("feedback-btn").addEventListener("click", function () {
    localStorage.setItem("scanMode", "feedback");
    window.location.href = buildFeedbackUrl(styleId);
  });
  document.getElementById("checkin-btn").addEventListener("click", function () {
    localStorage.setItem("scanMode", "checkinout");
    window.location.href = buildCheckUrl("Checked In", styleId);
  });
  document.getElementById("checkout-btn").addEventListener("click", function () {
    localStorage.setItem("scanMode", "checkinout");
    window.location.href = buildCheckUrl("Checked Out", styleId);
  });
</script>
