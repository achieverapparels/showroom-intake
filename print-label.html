<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Print label</title>
<style>
  @page { size: 50mm 50mm; margin: 0; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 50mm; height: 50mm;
    background: #fff;
  }
  body {
    display: flex; align-items: center; justify-content: center;
    padding: 3mm; /* safe margin on all 4 sides in case the printer doesn't center exactly */
  }
  img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
  }
  #error {
    display: none;
    font-family: Arial, sans-serif;
    font-size: 10pt;
    color: #b00020;
    text-align: center;
  }
</style>
</head>
<body>
  <img id="qr" alt="QR code label">
  <p id="error">No label image found. Reopen this link from the email.</p>
<script>
  var params = new URLSearchParams(window.location.search);
  var src = params.get('src');
  var img = document.getElementById('qr');
  var errorEl = document.getElementById('error');

  if (!src) {
    img.style.display = 'none';
    errorEl.style.display = 'block';
  } else {
    img.onload = function () {
      // Give the browser a moment to finish layout, then open the print dialog automatically.
      setTimeout(function () { window.print(); }, 200);
    };
    img.onerror = function () {
      img.style.display = 'none';
      errorEl.textContent = 'Label image failed to load. Try opening it again.';
      errorEl.style.display = 'block';
    };
    img.src = src;
  }
</script>
</body>
</html>
