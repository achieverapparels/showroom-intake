<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Print label</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700&display=swap" rel="stylesheet">
<style>
  @page { size: 50mm 50mm; margin: 0; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 50mm; height: 50mm;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: 'Manrope', Arial, sans-serif;
    background: #fff;
  }
  img { width: 34mm; height: 34mm; }
  p {
    margin: 1.5mm 0 0;
    font-size: 8.5pt;
    font-weight: 700;
    text-align: center;
    line-height: 1.35;
    color: #1A3049;
    white-space: pre-line;
  }
  #error {
    display: none;
    font-size: 10pt;
    color: #b00020;
    text-align: center;
    padding: 0 3mm;
  }
</style>
</head>
<body>
  <img id="qr" alt="QR code">
  <p id="label"></p>
  <p id="error">No label found. Reopen this link from the email.</p>
<script>
  var params = new URLSearchParams(window.location.search);
  var src = params.get('src');
  var label = params.get('label') || '';
  var img = document.getElementById('qr');
  var errorEl = document.getElementById('error');

  document.getElementById('label').textContent = label;

  if (!src) {
    img.style.display = 'none';
    errorEl.style.display = 'block';
  } else {
    img.onload = function () {
      // Give the browser a moment to finish layout, then open the print dialog automatically.
      setTimeout(function () { window.print(); }, 200);
    };
    img.onerror = function () {
      img.style.display = 'none';
      errorEl.textContent = 'Label image failed to load. Try opening it again.';
      errorEl.style.display = 'block';
    };
    img.src = src;
  }
</script>
</body>
</html>
